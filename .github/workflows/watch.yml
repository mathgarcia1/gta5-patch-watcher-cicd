name: GTA 5 Patch Watcher - Watch

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run patch watcher
        run: python watcher.py

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet -- data/latest_patch.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      
      - name: No update detected
        if: steps.changes.outputs.changed == 'false'
        run: echo "No patch update detected."

      - name: Update detected
        if: steps.changes.outputs.changed == 'true'
        run: |
          echo "A new patch update was detected!"
          git diff -- data/latest_patch.json

      - name: Commit and push update
        if: steps.changes.outputs.changed == 'true'
        id: publish
        run: |
          BRANCH_NAME="bot/patch-update-${GITHUB_RUN_ID}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH_NAME"

          git add data/latest_patch.json
          
          git commit -m "chore: update GTA 5 patch data"

          git push origin "$BRANCH_NAME"

          echo "branch=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base "main" \
            --head "${{ steps.publish.outputs.branch }}" \
            --title "chore: update GTA 5 patch data" \
            --body "A new GTA 5 patch was detected automatically"
            