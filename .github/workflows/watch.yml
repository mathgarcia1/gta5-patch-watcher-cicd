name: GTA 5 Patch Watcher - Watch

on:
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run patch watcher
        run: python watcher.py

      - name: Detect changes
        id: changes
        run: |
          if git dff --quiet -- data/latest_patch.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      
      - name: No update detected
        if: steps.changes.outputs.changed == 'false'
        run: echo "No patch update detected."

      - name: Update detected
        if: steps.changes.outputs.changed == 'true'
        run: |
          echo "A new patch update was detected!"
          git diff -- data/latest_patch.json