name: GTA 5 Patch Watcher - Watch

on:
  workflow_dispatch:

  schedule:
    - cron: "0 9 * * *"
      timezone: "America/Sao_Paulo"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gta5-patch-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run patch watcher
        run: python watcher.py

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet -- data/latest_patch.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      
      - name: Check bot branch
        if: steps.changes.outputs.changed == 'true'
        id: bot_branch
        run: |
          if git ls-remote --exit-code --heads origin bot/patch-update > /dev/null 2>&1; then
            git fetch --force origin \
              bot/patch-update:refs/remotes/origin/bot/patch-update

            if git diff --quiet origin/bot/patch-update -- data/latest_patch.json; then
              echo "needs_publish=false" >> "$GITHUB_OUTPUT"
              echo "Bot branch already contains the current patch."
            else
              echo "needs_publish=true" >> "$GITHUB_OUTPUT"
              echo "Bot branch needs to be updated."
            fi
          else
            echo "needs_publish=true" >> "$GITHUB_OUTPUT"
            echo "Bot branch does not exist yet."
          fi
      
      - name: No update detected
        if: steps.changes.outputs.changed == 'false'
        run: echo "No patch update detected."

      - name: Update detected
        if: steps.changes.outputs.changed == 'true'
        run: |
          echo "A new patch update was detected!"
          git diff -- data/latest_patch.json

      - name: Commit and push update
        if: >
          steps.changes.outputs.changed == 'true' &&
          steps.bot_branch.outputs.needs_publish == 'true'
        run: |
          BRANCH_NAME="bot/patch-update"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH_NAME"

          git add data/latest_patch.json
          git commit -m "chore: update GTA 5 patch data"

          git push --force origin "$BRANCH_NAME"

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_PR=$(gh pr list \
            --head "bot/patch-update" \
            --base "main" \
            --state open \
            --json number \
            --jq 'length')

          if [ "$EXISTING_PR" -eq 0 ]; then
            gh pr create \
              --base "main" \
              --head "bot/patch-update" \
              --title "chore: update GTA 5 patch data" \
              --body "A new GTA 5 patch was detected automatically"
          else
            echo "An open pull request already exists."
          fi